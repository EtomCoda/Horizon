<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Favicon set: search engine crawlers (Google, Bing, etc.) have inconsistent/no
      support for WebP favicons, which is why the icon showed in-browser (browsers
      support WebP fine) but not in search results. PNG/ICO cover both cases.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizon - GPA Tracker | Track Your CGPA & Simulate Grades</title>
    <meta name="description" content="Horizon - Track your GPA, simulate future grades, and get personalized insights to master your academic journey." />
    <link rel="canonical" href="https://yourhorizon.me/" />

    <!-- Preconnect to critical origins for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://va.vercel-scripts.com" />

    <!-- Preconnect to Supabase (extracted from env, use your actual domain) -->
    <link rel="dns-prefetch" href="https://hkkplohwaetxarnecsqb.supabase.co" />

    <!-- Open Graph / Facebook, Instagram, TikTok link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Horizon" />
    <meta property="og:url" content="https://yourhorizon.me/" />
    <meta property="og:title" content="Horizon - GPA Tracker | Track Your CGPA & Simulate Grades" />
    <meta property="og:description" content="Track your GPA, simulate future grades, and get personalized insights to master your academic journey." />
    <meta property="og:image" content="https://yourhorizon.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Horizon - Stay one step ahead of your GPA" />

    <!-- Twitter/X Card (also used as a fallback by several other platforms) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Horizon - GPA Tracker | Track Your CGPA & Simulate Grades" />
    <meta name="twitter:description" content="Track your GPA, simulate future grades, and get personalized insights to master your academic journey." />
    <meta name="twitter:image" content="https://yourhorizon.me/og-image.png" />
    <meta name="twitter:image:alt" content="Horizon - Stay one step ahead of your GPA" />

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://va.vercel-scripts.com https://js.paystack.co https://vercel.live https://us.i.posthog.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://us.i.posthog.com https://us-assets.i.posthog.com; connect-src 'self' https://*.supabase.co https://*.vercel-scripts.com https://checkout.paystack.com https://api.paystack.co https://vercel.live https://us.i.posthog.com https://us-assets.i.posthog.com; frame-src 'self' https://checkout.paystack.com https://standard.paystack.co https://vercel.live;" />
    
    <!-- Critical CSS - Inline for fastest first paint -->
    <style>
      /* Critical styles for initial skeleton/loading state */
      *, *::before, *::after { box-sizing: border-box; }
      html { 
        background-color: #f9fafb; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html.dark { background-color: #111827; }
      body { 
        margin: 0; 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: inherit;
      }
      
      /* Loading skeleton styles */
      #root:empty {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::before {
        content: '';
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Dark mode skeleton */
      html.dark #root:empty::before {
        border-color: #374151;
        border-top-color: #3b82f6;
      }
    </style>
    
    <!-- Apply dark mode immediately to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
