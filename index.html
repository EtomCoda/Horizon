<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/faviconhorizon.webp"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Horizon - Track your GPA, simulate future grades, and get personalized insights to master your academic journey." />
    
    <!-- Preconnect to critical origins for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://va.vercel-scripts.com" />
    
    <!-- Preconnect to Supabase (extracted from env, use your actual domain) -->
    <link rel="dns-prefetch" href="https://hkkplohwaetxarnecsqb.supabase.co" />
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://va.vercel-scripts.com https://js.paystack.co https://vercel.live https://us.i.posthog.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://us.i.posthog.com https://us-assets.i.posthog.com; connect-src 'self' https://*.supabase.co https://*.vercel-scripts.com https://checkout.paystack.com https://api.paystack.co https://vercel.live https://us.i.posthog.com https://us-assets.i.posthog.com; frame-src 'self' https://checkout.paystack.com https://standard.paystack.co https://vercel.live;" />
    
    <title>Horizon - GPA Tracker</title>
    
    <!-- Critical CSS - Inline for fastest first paint -->
    <style>
      /* Critical styles for initial skeleton/loading state */
      *, *::before, *::after { box-sizing: border-box; }
      html { 
        background-color: #f9fafb; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html.dark { background-color: #111827; }
      body { 
        margin: 0; 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: inherit;
      }
      
      /* Loading skeleton styles */
      #root:empty {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::before {
        content: '';
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Dark mode skeleton */
      html.dark #root:empty::before {
        border-color: #374151;
        border-top-color: #3b82f6;
      }
    </style>
    
    <!-- Apply dark mode immediately to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
